<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="/style.css" rel="stylesheet" />
    <script src="/script.js" defer></script>
  </head>
  <body>
    <div id="calculator-container">
      <div id="display"></div>
      <ul class="buttons-list">
        <li class="button">C</li>
        <li class="button">√</li>
        <li class="button">%</li>
        <li class="button">÷</li>
      </ul>
      <ul class="buttons-list">
        <li class="button">7</li>
        <li class="button">8</li>
        <li class="button">9</li>
        <li class="button">×</li>
      </ul>
      <ul class="buttons-list">
        <li class="button">4</li>
        <li class="button">5</li>
        <li class="button">6</li>
        <li class="button">-</li>
      </ul>
      <ul class="buttons-list">
        <li class="button">1</li>
        <li class="button">2</li>
        <li class="button">3</li>
        <li class="button">+</li>
      </ul>
      <ul class="buttons-list">
        <li class="button">+/-</li>
        <li class="button">0</li>
        <li class="button">.</li>
        <li class="button equals-button">=</li>
      </ul>
    </div>
  </body>
</html>
